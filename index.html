<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Periscópio</title>
    <script>
      // Applies the theme chosen on this device (src/appearance/appearance.ts), or the system's,
      // before the first paint, so the page never flashes the other theme.
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        const apply = () => {
          let theme = null;
          try {
            theme = localStorage.getItem("periscopio:tema");
          } catch {}
          const dark = theme === "escuro" || (theme !== "claro" && query.matches);
          document.documentElement.classList.toggle("dark", dark);
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute("content", dark ? "dark" : "light");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0b0b0b" : "#ffffff");
        };
        apply();
        query.addEventListener("change", apply);
        window.addEventListener("storage", apply);
        window.addEventListener("periscopio:tema", apply);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
