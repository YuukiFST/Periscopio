<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Periscópio</title>
    <script>
      // Applies the theme chosen on this device (src/appearance/appearance.ts), or the system's,
      // before the first paint, so the page never flashes the other theme.
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        let unsaved = null;
        const apply = () => {
          let theme = unsaved;
          try {
            theme ??= localStorage.getItem("periscopio:tema");
          } catch {}
          const dark = theme === "escuro" || (theme !== "claro" && query.matches);
          const root = document.documentElement;
          if (root.classList.contains("dark") !== dark) {
            // Each color has its own fade; switching them all at once keeps the change from smearing.
            const pause = document.createElement("style");
            pause.textContent = "*,*::before,*::after{transition:none!important}";
            document.head.append(pause);
            root.classList.toggle("dark", dark);
            void getComputedStyle(root).color;
            requestAnimationFrame(() => requestAnimationFrame(() => pause.remove()));
          }
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute("content", dark ? "dark" : "light");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#171717" : "#fafafa");
        };
        apply();
        query.addEventListener("change", apply);
        window.addEventListener("storage", apply);
        window.addEventListener("periscopio:tema", (event) => {
          unsaved = event.detail;
          apply();
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
